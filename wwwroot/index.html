<!DOCTYPE html>
<html>
<head>
    <title>Payroll Management</title>
</head>
<body>

    <h2>Payroll Management System</h2>

    <label>Month:</label>
    <input type="number" id="month" />

    <label>Year:</label>
    <input type="number" id="year" />

    <button onclick="runPayroll()">Run Payroll</button>
    <button onclick="loadPayroll()">View Payroll</button>

    <br /><br />

    <table border="1" id="tblPayroll">
        <thead>
            <tr>
                <th>Employee Id</th>
                <th>Employee Name</th>
                <th>Basic Salary</th>
                <th>Gross Pay</th>
                <th>Net Pay</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>

    <script>

        async function runPayroll() {

            let month =
                document.getElementById("month").value;

            let year =
                document.getElementById("year").value;

            let response = await fetch(
                "/api/Payroll/run",
                {
                    method: "POST",
                    headers:
                    {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        month: parseInt(month),
                        year: parseInt(year)
                    })
                });

            let result = await response.text();

            alert(result);
        }

        async function loadPayroll() {

            let month =
                document.getElementById("month").value;

            let year =
                document.getElementById("year").value;

            let response =
                await fetch(
                    `/api/Payroll/${month}/${year}`);

            let data =
                await response.json();

            let tbody =
                document.querySelector(
                    "#tblPayroll tbody");

            tbody.innerHTML = "";

            data.forEach(x => {

                tbody.innerHTML += `
                    <tr>
                        <td>${x.employeeId}</td>
                        <td>${x.employeeName}</td>
                        <td>${x.basicSalary}</td>
                        <td>${x.grossPay}</td>
                        <td>${x.netPay}</td>
                    </tr>`;
            });
        }

    </script>

</body>
</html>
